[package]
name = "mafold-transcript"
version = "0.1.0"
edition = "2021"
description = "The agent→chat transcript layer: one event vocabulary, one card renderer, one grouping state machine — shared by the self-hosted daemon and the server-side brains."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one way a number reads (`mafold_types::units`) — the result card's
# attributes and the compacted line go through the same ruler as every client.
mafold-types = { path = "../mafold-types" }

[dev-dependencies]
# A CommonMark reader for the tests: how a client (react-markdown / remark,
# the same CommonMark rules) will actually read what the transcript writes.
pulldown-cmark = { version = "0.13", default-features = false }

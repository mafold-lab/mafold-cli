[package]
name = "mafold-cli"
version = "0.9.150"
edition = "2021"
description = "Mafold from your terminal — a CLI client (chats / send) + a Claude Code agent daemon."
license = "MIT"

[[bin]]
name = "mafold"
path = "src/main.rs"

[dependencies]
# The shared client core: validated RPC transport (methods registry — a method-
# name typo dies locally, not as a server 404), typed methods over the
# mafold-types wire model (re-exported), and the pooled HTTP client every other
# client uses. Same-language consumer: no FFI, plain crate dep.
mafold-core = { path = "crates/mafold-core" }
# The agent→chat transcript layer: the AgentEvent vocabulary, the card
# renderer, and the grouping state machine. Shared with mafold-api so a turn
# driven by a server-side brain renders as the same cards as one driven by a
# harness here — one transcript pipeline, not one per producer.
mafold-transcript = { path = "crates/mafold-transcript" }
uuid = "1"
# `io-std` is for `mafold mcp serve`: an MCP stdio server reads requests off
# stdin while awaiting network calls to providers, so stdin has to be async —
# a blocking read would stall the whole runtime between turns.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "io-std", "net", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
futures-util = "0.3"
# Pictures go up as a ≤2560 view + 40px strip (src/thumb.rs). Decoders for what
# agents actually attach; WebP is encoded lossless only (screenshots), photos
# as JPEG. No HEIC — those go up as they are.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
sha2 = "0.10"
# NFC, the form Claude Code hashes a config directory in to name its Keychain
# item (`accounts::LoginStore::resolve`). Already in the graph via mafold-types.
unicode-normalization = "0.1.25"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `mafold diagnose` masks what looks like a token, a JWT or an email in the
# logs it bundles (diagnose.rs) — shapes, not values, so a pattern language.
regex = "1"

# Process/session control (detach via setsid, liveness + stop via signals) — Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native Win32 for the same primitives: OpenProcess/TerminateProcess (liveness +
# stop), DETACHED_PROCESS creation flags (detach), LockFileEx (update lock), and
# GetConsoleWindow/ShowWindow (hide the console the logon task hands the
# supervisor — see platform::hide_console).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization",
    # `shell.exec`'s timeout: a job object is the process group Windows lacks
    # (computer::Tree). CreateJobObjectW's signature needs the Security types.
    "Win32_System_JobObjects",
    "Win32_Security",
    # GetTickCount64: when the machine booted (platform::boot_time), so a
    # supervisor that went down with it doesn't read as a crash.
    "Win32_System_SystemInformation",
    # CreateToolhelp32Snapshot: the processes a daemon started, ended with it
    # (platform::end_tree) — nothing else on Windows takes them down.
    "Win32_System_Diagnostics_ToolHelp",
] }

# Test-only: `#[tokio::test(start_paused = true)]`. A failed attachment fetch
# retries five times with exponential backoff (`client::MEDIA_ATTEMPTS`), which
# is ~9 real seconds the "the picture didn't reach me" test would otherwise sit
# through. A paused clock advances itself the moment the runtime idles, so the
# test asserts the same behaviour in no time at all. Dev-only: the shipped
# binary never builds with this feature on.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

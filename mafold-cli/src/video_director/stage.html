<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 导演台 · 灰盒预演</title>
<style>
:root{--bg:#0b0d12;--panel:#12151d;--line:#232836;--text:#d9dde7;--dim:#8a92a5;--pink:#ff5fa2;--amber:#ffc94a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:14px;font-weight:600;margin:0}
header .sub{color:var(--dim);font-size:12px}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--dim);padding:5px 12px;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:#232a3a;color:#fff}
.btn{background:#1b2030;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:#3a4256}
label.chk{display:inline-flex;gap:5px;align-items:center;color:var(--dim);cursor:pointer;user-select:none}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#07080c}
#stage canvas{position:absolute;display:block}
#plan{left:0;top:0;width:100%;height:100%;display:none}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:12px;padding:1px 7px;border-radius:999px;background:rgba(9,11,16,.78);border:1px solid currentColor;pointer-events:none;white-space:nowrap;display:none}
#pipf{position:absolute;border:1px solid rgba(255,201,74,.75);pointer-events:none;display:none}
#pipf span{position:absolute;left:6px;top:3px;font-size:11px;color:var(--amber);text-shadow:0 1px 2px #000}
#hint{position:absolute;left:10px;bottom:8px;color:var(--dim);font-size:11px;pointer-events:none;text-shadow:0 1px 2px #000}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;padding:20px;text-align:center;white-space:pre-line}
footer{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#play{min-width:76px}
#scrub{flex:1;accent-color:var(--pink)}
#tlabel{font-variant-numeric:tabular-nums;color:var(--dim);min-width:190px;text-align:right}
#side{position:absolute;top:0;right:0;bottom:0;width:min(440px,92%);background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column;gap:8px;padding:10px;z-index:5}
#side.open{display:flex}
#side textarea{flex:1;resize:none;background:#090b10;color:#cfd6e6;border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 Consolas,"Cascadia Mono",ui-monospace,monospace}
#msg{min-height:18px;font-size:12px;color:var(--dim)}
#msg.err{color:#ff7b7b}
body.render header,body.render footer,body.render #hint,body.render #boot{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>3D 导演台</h1><span class="sub" id="title"></span>
    <div class="seg" id="modes"><button data-m="shot" class="on">导演视角</button><button data-m="free">自由视角</button><button data-m="plan">平面图</button></div>
    <label class="chk"><input type="checkbox" id="optPaths" checked>路径/机位</label>
    <label class="chk"><input type="checkbox" id="optPip" checked>画中画</label>
    <span class="sp"></span>
    <button class="btn" id="btnJson">JSON</button>
  </header>
  <div id="stage">
    <div id="boot">正在加载 three.js …</div>
    <canvas id="plan"></canvas>
    <div id="pipf"><span>导演视角</span></div>
    <div class="lbl" id="lbl-cam" style="color:#ffc94a">镜头</div>
    <div id="hint">左键旋转 · 右键平移 · 滚轮缩放 · 空格 播放/暂停 · ←/→ 逐帧 · 1/2/3 切换视图</div>
    <div id="side">
      <div style="display:flex;gap:8px;align-items:center"><b>分镜 JSON</b><span class="sp"></span><button class="btn" id="btnApply">应用</button><button class="btn" id="btnReset">恢复内置</button><button class="btn" id="btnClose">关闭</button></div>
      <textarea id="ta" spellcheck="false"></textarea>
      <div id="msg">可粘贴另一份 blocking JSON，点「应用」即重建场景。</div>
    </div>
  </div>
  <footer>
    <button class="btn" id="play">▶ 播放</button>
    <input type="range" id="scrub" min="0" max="5" step="0.001" value="0">
    <span id="tlabel">0.00 s</span>
  </footer>
</div>

<script type="text/plain" id="app-src">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const RENDER = !!(window.__RENDER__ || new URLSearchParams(location.search).has('render'));
const D2R = Math.PI / 180;
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (u) => u * u * (3 - 2 * u);
const EASE = { linear: (u) => u, in: (u) => u * u, out: (u) => 1 - (1 - u) * (1 - u), inOut: smooth };
const POSE_ZH = { run: '奔跑', jump: '起跳', crouch: '落地', stand: '起身', idle: '站定' };
const CAM_COLOR = '#ffc94a';
const FONT = '"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif';
const fmt = (v) => (Math.abs(v) < 0.05 ? 0 : v).toFixed(1);

const EMBED_TEXT = $('blocking').textContent.trim();
let DATA = null, ASPECT = 16 / 9, ACTORS = [], T = 0;

/* ------------------------------------------------------------------ data */
function parseAspect(a) {
  if (typeof a === 'number' && a > 0) return a;
  const m = String(a || '16:9').match(/([\d.]+)\s*[:x/]\s*([\d.]+)/);
  return m ? +m[1] / +m[2] : 16 / 9;
}
function normalize(d) {
  if (!d || typeof d !== 'object') throw new Error('不是 JSON 对象');
  if (!Array.isArray(d.actors)) throw new Error('缺少 actors[]');
  if (!d.camera || !Array.isArray(d.camera.keys) || !d.camera.keys.length) throw new Error('缺少 camera.keys[]');
  for (const k of d.camera.keys) if (!Array.isArray(k.pos) || !Array.isArray(k.look)) throw new Error('camera key 需要 pos 和 look');
  for (const a of d.actors) {
    if (!Array.isArray(a.keys) || !a.keys.length) throw new Error('actor ' + (a.id || '?') + ' 缺少 keys[]');
    for (const k of a.keys) if (!Array.isArray(k.pos)) throw new Error('actor ' + (a.id || '?') + ' 的 key 缺少 pos');
    a.keys.sort((p, q) => p.t - q.t);
  }
  d.camera.keys.sort((p, q) => p.t - q.t);
  d.fps = +d.fps || 24;
  d.duration = +d.duration || d.camera.keys[d.camera.keys.length - 1].t || 5;
  d.set = Array.isArray(d.set) ? d.set : [];
  d.env = d.env || {};
  return d;
}

/* --------------------------------------------------------- interpolation */
function segIndex(K, t) { let i = 0; while (i < K.length - 2 && t >= K[i + 1].t) i++; return i; }
function slopeAt(K, i, get) {
  const n = K.length, a = K[Math.max(0, i - 1)], b = K[Math.min(n - 1, i + 1)];
  const dt = (b.t - a.t) || 1, pa = get(a), pb = get(b);
  return pa.map((v, j) => (pb[j] - v) / dt);
}
// time-parameterised Catmull-Rom (cubic Hermite, finite-difference tangents): C1 in time
function hermite(K, t, get) {
  const n = K.length;
  if (n === 1 || t <= K[0].t) return get(K[0]).slice();
  if (t >= K[n - 1].t) return get(K[n - 1]).slice();
  const i = segIndex(K, t), k0 = K[i], k1 = K[i + 1], h = k1.t - k0.t, u = (t - k0.t) / h;
  const p0 = get(k0), p1 = get(k1), m0 = slopeAt(K, i, get), m1 = slopeAt(K, i + 1, get);
  const u2 = u * u, u3 = u2 * u, a = 2 * u3 - 3 * u2 + 1, b = u3 - 2 * u2 + u, c = -2 * u3 + 3 * u2, e = u3 - u2;
  return p0.map((v, j) => a * v + b * h * m0[j] + c * p1[j] + e * h * m1[j]);
}
function camState(t) {
  const K = DATA.camera.keys;
  return { pos: hermite(K, t, (k) => k.pos), look: hermite(K, t, (k) => k.look), fov: hermite(K, t, (k) => [k.fov ?? 50])[0] };
}
// parabola from y0 to y1 whose top is `apex` above y0
function arcY(y0, y1, apex, u) {
  const d = y1 - y0, h = Math.max(apex, d + 0.05, 0.05);
  const c = (2 * h - d) + 2 * Math.sqrt(Math.max(0, h * (h - d))), b = c + d;
  return y0 + b * u - c * u * u;
}
function actorPos(a, t) {
  const K = a.keys, n = K.length;
  if (n === 1 || t <= K[0].t) return K[0].pos.slice();
  if (t >= K[n - 1].t) return K[n - 1].pos.slice();
  if (a.kind === 'orb' || a.smooth) return hermite(K, t, (k) => k.pos);
  const i = segIndex(K, t), k0 = K[i], k1 = K[i + 1], u = (t - k0.t) / (k1.t - k0.t);
  if (k0.pose === 'jump') return [lerp(k0.pos[0], k1.pos[0], u), arcY(k0.pos[1], k1.pos[1], k0.apex ?? 0.8, u), lerp(k0.pos[2], k1.pos[2], u)];
  const ue = (EASE[k0.ease] || EASE.linear)(u);
  return k0.pos.map((v, j) => lerp(v, k1.pos[j], ue));
}
function actorFace(a, t) {
  const K = a.keys, n = K.length;
  if (n === 1 || t <= K[0].t) return K[0].face || 0;
  if (t >= K[n - 1].t) return K[n - 1].face || 0;
  const i = segIndex(K, t), k0 = K[i], k1 = K[i + 1], u = (t - k0.t) / (k1.t - k0.t);
  return lerp(k0.face || 0, k1.face || 0, (EASE[k0.ease] || smooth)(u));
}

/* ----------------------------------------------------------------- poses */

    _v.set(i & 1 ? _box.max.x : _box.min.x, i & 2 ? _box.max.y : _box.min.y, i & 4 ? _box.max.z : _box.min.z);
    if (_v.clone().applyMatrix4(shotCam.matrixWorldInverse).z > -0.01) behind = true;
    _v.project(shotCam);
    x0 = Math.min(x0, _v.x); x1 = Math.max(x1, _v.x); y0 = Math.min(y0, _v.y); y1 = Math.max(y1, _v.y);
  }
  const r = (v) => +v.toFixed(3);
  return { x0: r(x0), x1: r(x1), y0: r(y0), y1: r(y1), h: r((y1 - y0) / 2), behind };
}
function glInfo() { const gl = renderer.getContext(), e = gl.getExtension('WEBGL_debug_renderer_info'); return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); }

function start() {
  buildAll(window.__BLOCKING__ ? structuredClone(window.__BLOCKING__) : JSON.parse(EMBED_TEXT));
  if (RENDER) return startRender();
  startPage();
}

/* ------------------------------------------- headless render API (render.mjs) */
function startRender() {
  document.body.classList.add('render');
  const RW = 854, RH = 480, SS = 2;                     // drawn at 2x, averaged down to 854x480
  renderer.setPixelRatio(SS); renderer.setSize(RW, RH); canvas.style.left = '0px'; canvas.style.top = '0px';
  const out = document.createElement('canvas'); out.width = RW; out.height = RH;
  const octx = out.getContext('2d');
  window.stage = {
    info: () => ({ duration: DATA.duration, fps: DATA.fps, aspect: ASPECT, frames: Math.round(DATA.duration * DATA.fps), gl: glInfo() }),
    frame(t) {
      setTime(t); helpers.visible = false;
      shotCam.aspect = RW / RH; shotCam.updateProjectionMatrix();
      renderer.setScissorTest(false); renderer.setViewport(0, 0, RW, RH); renderer.render(scene, shotCam);
      octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high'; octx.drawImage(canvas, 0, 0, RW, RH);
      const framing = {}; scene.updateMatrixWorld();
      for (const A of ACTORS) framing[A.def.id] = ndcOf(A.orb || A.root);
      return { png: out.toDataURL('image/png'), framing };
    },
    plan(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; drawPlan(c.getContext('2d'), w, h, null); return c.toDataURL('image/png'); },
    async contact(urls, labels, tw, th) {
      const gap = 8, n = urls.length, c = document.createElement('canvas'); c.width = n * tw + (n + 1) * gap; c.height = th + gap * 2;
      const g = c.getContext('2d'); g.fillStyle = '#0c0f16'; g.fillRect(0, 0, c.width, c.height);
      for (let i = 0; i < n; i++) {
        const img = new Image(); img.src = urls[i]; await img.decode();
        const x = gap + i * (tw + gap); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.drawImage(img, x, gap, tw, th);
        tag(g, labels[i], x + 8, gap + 7, { size: 15, align: 'left', valign: 'top', color: '#ffffff', bg: 'rgba(0,0,0,0.62)' });
      }
      return c.toDataURL('image/png');
    },
    ready: true,
  };
}

/* ------------------------------------------------------- interactive page */
function startPage() {
  $('boot').style.display = 'none';
  const freeCam = new THREE.PerspectiveCamera(42, 1, 0.1, 4000); freeCam.position.set(-4, 10, 17);
  const controls = new OrbitControls(freeCam, canvas); controls.target.set(0.8, -0.3, 0); controls.enableDamping = true; controls.update();
  let mode = 'shot', playing = false, view = { w: 1, h: 1 }, last = performance.now();
  const ta = $('ta'), msg = $('msg');
  ta.value = EMBED_TEXT;
  const fr = () => Math.round(DATA.duration * DATA.fps);
  function refreshMeta() { $('title').textContent = (DATA.title || '') + ' · ' + DATA.duration.toFixed(1) + ' s · ' + DATA.fps + ' fps · ' + (DATA.aspect || '16:9'); $('scrub').max = DATA.duration; $('scrub').step = 1 / DATA.fps; }
  function layout() {
    const st = $('stage'), W = st.clientWidth, H = st.clientHeight;
    let w = W, h = H, x = 0, y = 0;
    if (mode === 'shot') { if (W / H > ASPECT) { w = Math.round(H * ASPECT); x = Math.round((W - w) / 2); } else { h = Math.round(W / ASPECT); y = Math.round((H - h) / 2); } }
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); renderer.setSize(Math.max(1, w), Math.max(1, h));
    canvas.style.left = x + 'px'; canvas.style.top = y + 'px'; view = { w, h };
    const pc = $('plan'), dpr = Math.min(2, window.devicePixelRatio || 1); pc.width = Math.max(1, Math.round(W * dpr)); pc.height = Math.max(1, Math.round(H * dpr));
  }
  function setMode(m) { mode = m; for (const b of document.querySelectorAll('#modes button')) b.classList.toggle('on', b.dataset.m === m); $('hint').style.display = m === 'free' ? 'block' : 'none'; layout(); }
  function hideLabels() { for (const A of ACTORS) A.label.style.display = 'none'; $('lbl-cam').style.display = 'none'; }
  function placeLabels(w, h) {
    const items = ACTORS.map((A) => { const p = A.root.position; return [A.label, new THREE.Vector3(p.x, p.y + (A.orb ? A.r + 0.3 : (A.def.height || 1.6) + 0.4), p.z)]; });
    items.push([$('lbl-cam'), shotCam.position.clone().add(new THREE.Vector3(0, 0.34, 0))]);
    for (const [el, v] of items) {
      v.project(freeCam); const vis = v.z > -1 && v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05;
      el.style.display = vis ? 'block' : 'none';
      if (vis) { el.style.left = (v.x + 1) / 2 * w + 'px'; el.style.top = (1 - v.y) / 2 * h + 'px'; }
    }
  }
  function draw() {
    const plan = mode === 'plan';
    canvas.style.display = plan ? 'none' : 'block'; $('plan').style.display = plan ? 'block' : 'none';
    if (plan) { const pc = $('plan'); drawPlan(pc.getContext('2d'), pc.width, pc.height, T); hideLabels(); $('pipf').style.display = 'none'; return; }
    const { w, h } = view;
    renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h);
    if (mode === 'shot') {
      helpers.visible = false; shotCam.aspect = ASPECT; shotCam.updateProjectionMatrix(); renderer.render(scene, shotCam);
      hideLabels(); $('pipf').style.display = 'none'; return;
    }
    controls.update();
    helpers.visible = $('optPaths').checked; if (helpers.visible) updateFrustum();
    freeCam.aspect = w / h; freeCam.updateProjectionMatrix(); renderer.render(scene, freeCam); placeLabels(w, h);
    const f = $('pipf');
    if ($('optPip').checked) {
      const pw = Math.round(Math.min(w * 0.3, 420)), ph = Math.round(pw / ASPECT), m = 12;
      helpers.visible = false; shotCam.aspect = ASPECT; shotCam.updateProjectionMatrix();
      renderer.setScissorTest(true); renderer.setScissor(w - pw - m, m, pw, ph); renderer.setViewport(w - pw - m, m, pw, ph);
      renderer.render(scene, shotCam); renderer.setScissorTest(false);
      Object.assign(f.style, { display: 'block', width: pw + 'px', height: ph + 'px', right: m + 'px', bottom: m + 'px' });
    } else f.style.display = 'none';
  }
  function syncUI() {
    $('scrub').value = T;
    const n = fr(), fi = Math.min(n - 1, Math.floor(T * DATA.fps + 1e-6));
    $('tlabel').textContent = T.toFixed(2) + ' s / ' + DATA.duration.toFixed(1) + ' s · 帧 ' + (fi + 1) + '/' + n;
    $('play').textContent = playing ? '❚❚ 暂停' : '▶ 播放';
  }
  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) { let t = T + dt; if (t >= DATA.duration) t = 0; T = t; }
    setTime(T); draw(); syncUI();
    requestAnimationFrame(tick);
  }
  const step = (d) => { playing = false; T = clamp(Math.round(T * DATA.fps + d) / DATA.fps, 0, DATA.duration); };
  $('modes').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); });
  $('play').onclick = () => { playing = !playing; if (playing && T >= DATA.duration - 1e-3) T = 0; };
  $('scrub').addEventListener('input', (e) => { playing = false; T = +e.target.value; });
  $('btnJson').onclick = () => $('side').classList.toggle('open');
  $('btnClose').onclick = () => $('side').classList.remove('open');
  $('btnApply').onclick = () => {
    try { buildAll(JSON.parse(ta.value)); refreshMeta(); msg.className = ''; msg.textContent = '已应用：' + ACTORS.length + ' 个角色，' + DATA.camera.keys.length + ' 个机位关键帧。'; }
    catch (err) { msg.className = 'err'; msg.textContent = '无法应用：' + err.message; }
  };
  $('btnReset').onclick = () => { ta.value = EMBED_TEXT; buildAll(JSON.parse(EMBED_TEXT)); refreshMeta(); msg.className = ''; msg.textContent = '已恢复内置分镜。'; };
  window.addEventListener('keydown', (e) => {
    if (e.target === ta) return;
    if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === '1') setMode('shot'); else if (e.key === '2') setMode('free'); else if (e.key === '3') setMode('plan');
  });
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe($('stage'));
  refreshMeta(); setMode('shot'); requestAnimationFrame(tick);
}

try { start(); }
catch (err) { const b = $('boot'); b.style.display = 'flex'; b.textContent = '出错了：' + err.message; console.error(err); }
</script>

<script>
// Boot: pick the first CDN that answers, map 'three' to it, then start the app module.
// (Works from file://, http(s):// and inside a sandboxed iframe; render.mjs serves the vendored copy offline.)
(function () {
  var BASES = ['https://cdn.jsdelivr.net/npm/three@0.160.0/', 'https://fastly.jsdelivr.net/npm/three@0.160.0/', 'https://unpkg.com/three@0.160.0/', 'https://registry.npmmirror.com/three/0.160.0/files/'];
  var boot = document.getElementById('boot');
  function fail(m) { boot.style.display = 'flex'; boot.textContent = m; }
  window.addEventListener('error', function (e) { if (!window.stage && !document.querySelector('#stage > canvas:not(#plan)')) fail('页面脚本出错：' + (e.message || e)); });
  function probe(i) {
    if (i >= BASES.length) { fail('three.js 加载失败：需要联网访问 cdn.jsdelivr.net / unpkg.com。'); return; }
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 6000);
    fetch(BASES[i] + 'build/three.module.js', { method: 'HEAD', mode: 'cors', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { clearTimeout(timer); if (r.ok) start(BASES[i]); else probe(i + 1); }, function () { clearTimeout(timer); probe(i + 1); });
  }
  function start(base) {
    var im = document.createElement('script'); im.type = 'importmap';
    im.textContent = JSON.stringify({ imports: { 'three': base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } });
    document.head.appendChild(im);
    var s = document.createElement('script'); s.type = 'module';
    s.textContent = document.getElementById('app-src').textContent;
    document.body.appendChild(s);
  }
  probe(0);
})();
</script>
